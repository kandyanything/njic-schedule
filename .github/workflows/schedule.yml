name: Refresh schedule

# Full rebuild every 3 hours, plus hourly 11 am–3 pm ET (15–19 UTC) for freshness
# during the game day. The build step is continue-on-error so fetched.json and
# refresh-log.json are committed even when a source is briefly unavailable — the
# log records that a check happened, not that the data changed.
#
# GitHub honours roughly half of these slots: scheduled runs on shared runners are
# best-effort and are delayed or dropped, worst during US peak, which is exactly
# the hourly window. The site therefore shows the times it was ACTUALLY checked
# rather than claiming a cadence. A Cloudflare Worker cron (see worker/) drives
# the hourly window through workflow_dispatch, which does fire reliably.
on:
  schedule:
    - cron: '0 0,3,6,9,12,15,16,17,18,19,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build schedule + feeds
        id: build
        continue-on-error: true
        run: |
          node scripts/build-schedule.js
          node scripts/split-schedule.js
          node scripts/build-feeds.js

      - name: Commit
        run: |
          printf '{"fetched":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/fetched.json
          node scripts/log-refresh.js "${{ steps.build.outcome }}"
          git config user.name "njic-schedule-bot"
          git config user.email "njic-schedule-bot@users.noreply.github.com"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            git add data/schedule feeds data/fetched.json data/refresh-log.json
            LABEL="Schedule refresh"
          else
            git add data/fetched.json data/refresh-log.json
            LABEL="Heartbeat (build failed)"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "$LABEL $(date -u +%Y-%m-%d_%H:%M)"
            git pull --rebase origin main
            git push
          fi
