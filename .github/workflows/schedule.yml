name: Refresh schedule

# Full rebuild every 3 hours (self-correcting — a thin source run can never erode
# the calendar). Bump the cron to '0 * * * *' for hourly if needed.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build schedule + feeds
        run: |
          node scripts/build-schedule.js
          node scripts/split-schedule.js
          node scripts/build-feeds.js

      - name: Commit if changed
        run: |
          git config user.name "njic-schedule-bot"
          git config user.email "njic-schedule-bot@users.noreply.github.com"
          git add data/schedule.json data/schedule feeds
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Schedule refresh $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi
