name: Refresh schedule

# Full rebuild every 3 hours; hourly 11 am–3 pm ET (15–19 UTC) for score freshness.
# The build step is continue-on-error so data/fetched.json is always committed —
# last-checked time on the site updates even when a source is temporarily unavailable.
on:
  schedule:
    - cron: '0 0,3,6,9,12,15,16,17,18,19,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build schedule + feeds
        id: build
        continue-on-error: true
        run: |
          node scripts/build-schedule.js
          node scripts/split-schedule.js
          node scripts/build-feeds.js

      - name: Commit
        run: |
          printf '{"fetched":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/fetched.json
          git config user.name "njic-schedule-bot"
          git config user.email "njic-schedule-bot@users.noreply.github.com"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            git add data/schedule feeds data/fetched.json
            LABEL="Schedule refresh"
          else
            git add data/fetched.json
            LABEL="Heartbeat (build failed)"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "$LABEL $(date -u +%Y-%m-%d_%H:%M)"
            git pull --rebase origin main
            git push
          fi
