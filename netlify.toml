# Static site — no build step. Publish the working tree as-is.
[build]
  publish = "."

# The combined schedule.json is a build artifact the workflow diffs against; it
# is never loaded by visitors (they get data/schedule/*). Keep it out of deploys.

# Calendar feeds: correct type + a short cache so subscriptions pick up changes.
[[headers]]
  for = "/feeds/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=1800"

[[headers]]
  for = "/feeds/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=1800"

[[headers]]
  for = "/data/schedule/*"
  [headers.values]
    Cache-Control = "public, max-age=1800"
